<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="940" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
      .slot { fill: #e3ecfb; stroke: #5b7fc7; stroke-width: 1.4; }
      .group { fill: none; stroke: #5b7fc7; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .edge { fill: none; stroke: #6b7280; stroke-width: 1.4; marker-end: url(#arrow); }
      .label { fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .method { fill: #4b5563; font-family: Menlo, Consolas, monospace; font-size: 12px; text-anchor: middle; }
      .note { fill: #6b7280; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="290" rx="10" fill="#ffffff"/>

  <!-- interface methods -->
  <text class="method" x="239" y="40">embed</text>
  <path d="M120,48 H358" stroke="#c4c9d2" stroke-width="1.2"/>
  <text class="method" x="534" y="40">trunk × passes</text>
  <path d="M384,48 H684" stroke="#c4c9d2" stroke-width="1.2"/>
  <text class="method" x="767" y="40">diffusion × steps</text>
  <path d="M712,48 H822" stroke="#c4c9d2" stroke-width="1.2"/>

  <!-- features -> embed -->
  <text class="label" x="52" y="110">features</text>
  <path class="edge" d="M88,110 H118"/>
  <rect class="slot" x="120" y="88" width="120" height="44" rx="6"/>
  <text class="label" x="180" y="110">input embedder</text>
  <path class="edge" d="M240,110 H260"/>
  <rect class="slot" x="262" y="88" width="96" height="44" rx="6"/>
  <text class="label" x="310" y="110">trunk init</text>
  <path class="edge" d="M358,110 H382"/>

  <!-- trunk -->
  <rect class="group" x="384" y="64" width="300" height="114" rx="8"/>
  <text class="note" x="408" y="78">trunk</text>
  <rect class="box" x="396" y="90" width="84" height="40" rx="6"/>
  <text class="label" x="438" y="110">templates</text>
  <path class="edge" d="M480,110 H490"/>
  <rect class="slot" x="492" y="90" width="76" height="40" rx="6"/>
  <text class="label" x="530" y="110">MSA</text>
  <path class="edge" d="M568,110 H578"/>
  <rect class="slot" x="580" y="90" width="92" height="40" rx="6"/>
  <text class="label" x="626" y="110">pairformer</text>
  <path class="edge" d="M626,130 V156 H438 V132"/>
  <text class="note" x="532" y="168">recycle</text>

  <!-- diffusion -->
  <path class="edge" d="M684,110 H710"/>
  <rect class="slot" x="712" y="88" width="110" height="44" rx="6"/>
  <text class="label" x="767" y="110">diffusion</text>
  <path class="edge" d="M752,88 C744,64 790,64 782,86"/>
  <path class="edge" d="M822,110 H850"/>
  <text class="label" x="888" y="110">coords</text>

  <!-- heads -->
  <path class="edge" d="M534,178 V214"/>
  <rect class="box" x="480" y="216" width="108" height="40" rx="6"/>
  <text class="label" x="534" y="236">distogram</text>
  <text class="method" x="534" y="276">distogram</text>
  <path class="edge" d="M767,132 V214"/>
  <path class="edge" d="M684,160 H700 V236 H710"/>
  <rect class="slot" x="712" y="216" width="110" height="40" rx="6"/>
  <text class="label" x="767" y="236">confidence</text>
  <text class="method" x="767" y="276">confidence_logits</text>

  <!-- legend -->
  <rect class="slot" x="40" y="236" width="14" height="14" rx="3"/>
  <text x="62" y="247" fill="#4b5563" font-size="12">abstract slot</text>
</svg>
